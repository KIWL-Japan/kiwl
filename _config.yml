title: KIWL
description: Charity fundraising for Mirai no Mori
url: ""
baseurl: ""

author:
  name: KIWL

theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  posts:
    output: true
  events:
    output: true
    permalink: /events/:name/

permalink: /news/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "events"
    values:
      layout: event
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - gpx-routes.md
  - kiwl-26-day-1-route.md
  - KiWL_logo_2019_FINAL.ai
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
